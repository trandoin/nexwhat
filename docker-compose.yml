services:
  app:
    image: shridh0r/whatomate:latest
    container_name: nexwhat_app
    restart: unless-stopped
    networks:
      - nexwhat_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  caddy:
    image: caddy:alpine
    container_name: nexwhat_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nexwhat_network

  db:
    image: postgres:17-alpine
    container_name: nexwhat_db
    restart: unless-stopped
    networks:
      - nexwhat_network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexwhat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexwhat}
      POSTGRES_DB: ${POSTGRES_DB:-nexwhat}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexwhat} -d ${POSTGRES_DB:-nexwhat}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nexwhat_redis
    restart: unless-stopped
    networks:
      - nexwhat_network
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

networks:
  nexwhat_network:

volumes:
  postgres-data:
  redis-data:
  caddy_data:
  caddy_config:
