<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="nexwhatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="92" height="92" x="4" y="4" rx="24" fill="url(#bubbleGrad)" filter="url(#glow)"/>

  <!-- Chat Bubble Tail -->
  <path d="M 22 76 L 12 90 L 34 84 Z" fill="#0891B2" />

  <!-- Modern N Graphic for NexWhat -->
  <path d="M 30 30 L 30 70 L 40 70 L 60 42 L 60 70 L 70 70 L 70 30 L 60 30 L 40 58 L 40 30 Z" fill="#FFFFFF" font-weight="bold"/>
  
  <!-- WhatsApp Accent Dot -->
  <circle cx="70" cy="30" r="5" fill="#34D399" stroke="#FFFFFF" stroke-width="2"/>
</svg>
